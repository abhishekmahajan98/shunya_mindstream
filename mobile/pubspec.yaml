name: mindstream_mobile
description: Shunya Mindstream — voice-first investment research, mobile edition.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # HTTP
  dio: ^5.8.0

  # Secure token storage
  flutter_secure_storage: ^9.2.2

  # Speech-to-text (native on-device)
  speech_to_text: ^7.0.0

  # Audio playback (for archive)
  audioplayers: ^6.1.0

  # Theme / UI preference persistence
  shared_preferences: ^2.4.0

  # Typography
  google_fonts: ^6.2.1

  # Markdown rendering (Gemini synthesis)
  flutter_markdown: ^0.7.5

  # Permissions
  permission_handler: ^11.4.0

  # Date formatting
  intl: ^0.19.0

  # File paths for audio
  path_provider: ^2.1.4
  wakelock_plus: ^1.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.1
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_native_splash:
  color: "#F8F6F2"
  color_dark: "#09090A"
  image: "assets/app_icon.png"
  image_dark: "assets/app_icon.png"
  android_12:
    color: "#F8F6F2"
    color_dark: "#09090A"
    image: "assets/app_icon.png"
    image_dark: "assets/app_icon.png"

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/app_icon.png"

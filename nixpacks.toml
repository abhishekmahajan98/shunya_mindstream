# Azure Speech SDK native deps — use nixLibs (not apt LD_LIBRARY_PATH).
# Prepending /usr/lib to LD_LIBRARY_PATH breaks Nix Python (__vdso_time dlopen error).
[phases.setup]
nixLibs = ["...", "libuuid", "alsa-lib", "openssl"]
aptPkgs = ["...", "libuuid1", "libasound2t64", "libssl3t64", "ca-certificates"]
